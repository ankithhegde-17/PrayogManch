  <text x="88" y="356" fill="url(#accent)" font-family="Arial, sans-serif" font-size="76" font-weight="700">place to come alive.</text>
  <text x="92" y="472" fill="#60647a" font-family="Arial, sans-serif" font-size="27">Websites, experiments, and useful digital experiences.</text>
