  <rect width="1200" height="630" fill="url(#background)"/>
  <g fill="none" stroke="#151b46" stroke-opacity=".09"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200"/><path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/></g>
